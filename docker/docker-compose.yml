version: '3.8'

services:
  # ==========================================
  # Hadoop NameNode
  # ==========================================
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    restart: always
    ports:
      - "9870:9870"
      - "9000:9000"
    volumes:
      - hadoop_namenode:/hadoop/dfs/name
    environment:
      - CLUSTER_NAME=tourism
    env_file:
      - ./hadoop.env
    networks:
      - tourism-net

  # ==========================================
  # Hadoop DataNode
  # ==========================================
  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode
    restart: always
    ports:
      - "9864:9864"
    volumes:
      - hadoop_datanode:/hadoop/dfs/data
    environment:
      SERVICE_PRECONDITION: "namenode:9870"
    env_file:
      - ./hadoop.env
    networks:
      - tourism-net

  # ==========================================
  # YARN ResourceManager
  # ==========================================
  resourcemanager:
    image: bde2020/hadoop-resourcemanager:2.0.0-hadoop3.2.1-java8
    container_name: resourcemanager
    restart: always
    ports:
      - "8088:8088"
    environment:
      SERVICE_PRECONDITION: "namenode:9870 datanode:9864"
    env_file:
      - ./hadoop.env
    networks:
      - tourism-net

  # ==========================================
  # YARN NodeManager
  # ==========================================
  nodemanager:
    image: bde2020/hadoop-nodemanager:2.0.0-hadoop3.2.1-java8
    container_name: nodemanager
    restart: always
    ports:
      - "8042:8042"
    environment:
      SERVICE_PRECONDITION: "namenode:9870 datanode:9864 resourcemanager:8088"
    env_file:
      - ./hadoop.env
    networks:
      - tourism-net

  # ==========================================
  # PostgreSQL - Hive Metastore数据库
  # ==========================================
  hive-metastore-postgresql:
    image: postgres:11-alpine
    container_name: hive-metastore-postgresql
    restart: always
    ports:
      - "15432:5432"
    environment:
      POSTGRES_DB: metastore
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
    volumes:
      - hive_postgresql:/var/lib/postgresql/data
    networks:
      - tourism-net

  # ==========================================
  # Hive Metastore
  # ==========================================
  hive-metastore:
    image: bde2020/hive:2.3.2-postgresql-metastore
    container_name: hive-metastore
    restart: always
    ports:
      - "9083:9083"
    env_file:
      - ./hadoop.env
    environment:
      SERVICE_PRECONDITION: "namenode:9870 datanode:9864 hive-metastore-postgresql:5432"
    volumes:
      - ./init-metastore.sh:/opt/init-metastore.sh
    depends_on:
      - hive-metastore-postgresql
      - namenode
      - datanode
    command: /bin/bash /opt/init-metastore.sh
    networks:
      - tourism-net

  # ==========================================
  # Hive Server
  # ==========================================
  hive-server:
    image: bde2020/hive:2.3.2-postgresql-metastore
    container_name: hive-server
    restart: always
    ports:
      - "10000:10000"
      - "10002:10002"
    env_file:
      - ./hadoop.env
    environment:
      HIVE_CORE_CONF_javax_jdo_option_ConnectionURL: "jdbc:postgresql://hive-metastore-postgresql/metastore"
      SERVICE_PRECONDITION: "hive-metastore:9083"
    volumes:
      - ./init-hive-tables.sh:/opt/init-hive-tables.sh
      - ./init-hiveserver.sh:/opt/init-hiveserver.sh
      - ./hive-init-partitioned.sql:/opt/hive-init-partitioned.sql
    depends_on:
      - hive-metastore
    command: /bin/bash /opt/init-hiveserver.sh
    networks:
      - tourism-net

  # ==========================================
  # Redis（无密码模式）
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: tourism-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --protected-mode no
    networks:
      - tourism-net

  # ==========================================
  # MySQL业务数据库
  # ==========================================
  mysql:
    image: mysql:8.0
    container_name: tourism-mysql
    restart: always
    ports:
      - "23306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: tourism_db
      MYSQL_USER: tourism
      MYSQL_PASSWORD: tourism123
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - tourism-net

volumes:
  hadoop_namenode:
  hadoop_datanode:
  hive_postgresql:
  redis_data:
  mysql_data:

networks:
  tourism-net:
    driver: bridge
