version: '3.8'

services:
  # ================================
  # MySQL 数据库
  # ================================
  mysql:
    image: mysql:8.0
    container_name: tourism-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: tourism_db
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./tourism-springboot/src/main/resources/sql/01_mysql_init.sql:/docker-entrypoint-initdb.d/01_mysql_init.sql
    networks:
      - tourism-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ================================
  # Redis 缓存
  # ================================
  redis:
    image: redis:7-alpine
    container_name: tourism-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - tourism-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ================================
  # Hadoop NameNode
  # ================================
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: tourism-namenode
    restart: always
    ports:
      - "9870:9870"  # Web UI
      - "9000:9000"  # HDFS端口
    environment:
      - CLUSTER_NAME=tourism
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - HDFS_CONF_dfs_replication=1
    env_file:
      - ./hadoop.env
    volumes:
      - namenode-data:/hadoop/dfs/name
      - ./init-hdfs.sh:/init-hdfs.sh
    networks:
      - tourism-net
    healthcheck:
      test: ["CMD", "hdfs", "dfs", "-ls", "/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ================================
  # Hadoop DataNode
  # ================================
  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: tourism-datanode
    restart: always
    depends_on:
      - namenode
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - HDFS_CONF_dfs_replication=1
    env_file:
      - ./hadoop.env
    volumes:
      - datanode-data:/hadoop/dfs/data
    networks:
      - tourism-net

  # ================================
  # Hive Metastore (PostgreSQL)
  # ================================
  hive-metastore-postgresql:
    image: bde2020/hive-metastore-postgresql:3.1.0
    container_name: tourism-hive-metastore-db
    restart: always
    environment:
      POSTGRES_PASSWORD: hive
    volumes:
      - hive-metastore-db:/var/lib/postgresql/data
    networks:
      - tourism-net

  # ================================
  # Hive Metastore
  # ================================
  hive-metastore:
    image: bde2020/hive:3.1.0-postgresql-metastore
    container_name: tourism-hive-metastore
    restart: always
    depends_on:
      - namenode
      - datanode
      - hive-metastore-postgresql
    environment:
      SERVICE_NAME: metastore
    env_file:
      - ./hadoop.env
    command: /opt/hive/bin/hive --service metastore
    ports:
      - "9083:9083"
    networks:
      - tourism-net

  # ================================
  # Hive Server
  # ================================
  hiveserver2:
    image: bde2020/hive:3.1.0-postgresql-metastore
    container_name: tourism-hiveserver2
    restart: always
    depends_on:
      - hive-metastore
    environment:
      SERVICE_NAME: hiveserver2
      HIVE_CORE_CONF_javax_jdo_option_ConnectionURL: "jdbc:postgresql://hive-metastore-postgresql/metastore"
    env_file:
      - ./hadoop.env
    ports:
      - "10000:10000"  # HiveServer2端口
      - "10002:10002"  # Web UI
    volumes:
      - ./tourism-springboot/src/main/resources/sql/02_hive_init.sql:/opt/hive_init.sql
    networks:
      - tourism-net
    healthcheck:
      test: ["CMD", "beeline", "-u", "jdbc:hive2://localhost:10000", "-e", "show databases;"]
      interval: 60s
      timeout: 30s
      retries: 3

  # ================================
  # Flask爬虫服务
  # ================================
  flask-crawler:
    build:
      context: ./tourism-flask
      dockerfile: Dockerfile
    container_name: tourism-flask
    restart: always
    depends_on:
      - mysql
      - redis
      - namenode
    ports:
      - "5000:5000"
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=root123456
      - MYSQL_DATABASE=tourism_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - HDFS_HOST=namenode
      - HDFS_PORT=9000
    volumes:
      - ./tourism-flask:/app
      - flask-data:/app/data
    networks:
      - tourism-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ================================
  # Celery Worker (爬虫任务队列)
  # ================================
  celery-worker:
    build:
      context: ./tourism-flask
      dockerfile: Dockerfile
    container_name: tourism-celery
    restart: always
    depends_on:
      - redis
      - flask-crawler
    command: celery -A celery_worker worker --loglevel=info
    environment:
      - MYSQL_HOST=mysql
      - REDIS_HOST=redis
      - HDFS_HOST=namenode
    volumes:
      - ./tourism-flask:/app
    networks:
      - tourism-net

  # ================================
  # Spring Boot后端服务
  # ================================
  springboot-api:
    build:
      context: ./tourism-springboot
      dockerfile: Dockerfile
    container_name: tourism-springboot
    restart: always
    depends_on:
      - mysql
      - redis
      - hiveserver2
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/tourism_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root123456
      - SPRING_REDIS_HOST=redis
      - HIVE_JDBC_URL=jdbc:hive2://hiveserver2:10000/default
    volumes:
      - ./tourism-springboot:/app
    networks:
      - tourism-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  tourism-net:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  namenode-data:
  datanode-data:
  hive-metastore-db:
  flask-data:
